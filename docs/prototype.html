<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Track · 화면 기획 v0.1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23263742'/%3E%3Ctext x='7' y='24' fill='white' font-size='24'%3ET%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--ink:#253746;--muted:#647783;--line:#dce4e6;--accent:#1e665a}*{box-sizing:border-box}body{margin:0;background:#f7f9f8;color:var(--ink);font:15px/1.6 'Segoe UI','Malgun Gothic',sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1b8172;outline-offset:3px}header{display:flex;align-items:center;gap:26px;padding:20px 30px;border-bottom:1px solid var(--line);background:white}header strong{font-size:21px;letter-spacing:-.7px}header span{margin-left:auto;color:var(--accent)}.layout{display:grid;grid-template-columns:185px 1fr;min-height:calc(100vh - 78px)}nav{padding:28px 18px;border-right:1px solid var(--line)}nav button{display:block;width:100%;text-align:left;padding:12px 16px;margin-bottom:8px;border:0;background:none;color:var(--muted)}nav button[aria-current=page]{background:#e0ede7;color:#154e44;font-weight:650}nav p{padding:18px 16px;color:var(--muted);font-size:12px}main{padding:36px 40px;min-width:0}.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.6px}h1{font-size:32px;letter-spacing:-1px;margin:6px 0 8px}h2{font-size:19px}.sub{color:var(--muted);margin:0 0 30px}.stats{display:flex;gap:40px;margin-bottom:32px}.stats strong{display:block;font-size:28px}.stats span{font-size:12px;color:var(--muted)}.bar{display:flex;gap:16px;align-items:center;margin:22px 0}.bar input{padding:9px;border:1px solid var(--line);background:white;min-width:230px}.bar label{margin-left:auto}.content{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:32px}table{border-collapse:collapse;width:100%;background:white}td,th{padding:15px 12px;text-align:left;border-bottom:1px solid var(--line);font-weight:400}th{font-size:12px;color:var(--muted)}td button{padding:0;background:none;border:0;text-align:left;color:var(--ink);font-weight:600}tr.selected{background:#eaf3ef}.badge{display:inline-block;font-size:12px;padding:3px 8px;background:#e5eee9;color:#26584c}.waiting{background:#fbefd5;color:#775212}.error{background:#fbe4e1;color:#8f382a}aside{border-left:1px solid var(--line);padding-left:24px}aside p{color:var(--muted);font-size:13px}aside button{padding:10px 14px;border:1px solid var(--line);background:white}small{color:var(--muted)}.timeline{list-style:none;padding:0}.timeline li{border-left:2px solid #c8dcd3;padding:0 0 28px 22px}.timeline time{display:block;color:var(--muted);font-size:12px}pre{padding:20px;background:#20333c;color:#dceee7;white-space:pre-wrap;font-size:13px}.graph{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:30px 0}.node{border:1px solid #aabdb5;background:white;padding:18px}.notice{padding:10px 0;color:#775212;font-size:13px}.foot{font-size:12px;color:var(--muted);margin-top:40px}#feedback{min-height:30px;color:var(--accent)}@media(max-width:1000px){.content{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line);padding:20px 0}}@media(max-width:650px){header{padding:16px;gap:14px;flex-wrap:wrap}header span{margin:0}main{padding:22px 16px}.layout{display:block}nav{display:flex;gap:3px;padding:8px;border-bottom:1px solid var(--line)}nav button{padding:9px;margin:0}nav p{display:none}.stats{gap:25px}.bar{flex-wrap:wrap}.bar label{margin:0}.table-wrap{overflow:auto}h1{font-size:26px}}
</style>
<header><strong>↗ Agent Track</strong><select aria-label="프로젝트"><option>업무 자동화 프로젝트</option></select><span id="connection">● 예시 장치 연결됨</span></header>
<div class="layout"><nav aria-label="주요 영역"><button aria-current="page" data-tab="Track">Track</button><button data-tab="Trail">Trail</button><button data-tab="Trace">Trace</button><button data-tab="Map">Map</button><p>기획 시안 v0.1<br>예시 데이터<br>운영 실행 연결 없음</p></nav><main><div class="eyebrow">Workspace / Operations</div><h1 id="title">진행 중인 작업</h1><p class="sub" id="description">실행 상황을 확인하고, 필요한 결정을 이어가세요.</p><div class="stats"><div><strong>3</strong><span>전체 작업</span></div><div><strong>1</strong><span>실행 중</span></div><div><strong>1</strong><span>내 결정 필요</span></div></div><div class="bar"><input id="search" placeholder="작업 검색" aria-label="작업 검색"><label>연결 상태 <select id="state"><option value="live">연결됨</option><option value="offline">연결 끊김</option><option value="empty">빈 결과</option><option value="error">조회 실패</option></select></label></div><div id="notice" role="status"></div><div class="content"><section id="view" aria-label="작업 보기"></section><aside id="detail"></aside></div><p id="feedback" role="status"></p><p class="foot">실제 pydemia UI component를 모사한 구조 검토용 HTML입니다. 명령·승인 버튼은 예시 반응만 표시합니다. 화면 설정은 서버에 저장되지 않습니다.</p></main></div>
<script>
const tasks=[{id:'AT-104',title:'실행 이벤트 adapter 연결',app:'Demian',status:'실행 중',cls:'',time:'12초 전'},{id:'AT-105',title:'중간 보고서 외부 게시',app:'Assistant',status:'승인 대기',cls:'waiting',time:'1분 전'},{id:'AT-106',title:'로컬 산출물 동기화',app:'Desktop',status:'실패',cls:'error',time:'3분 전'}];let tab='Track',selected=tasks[0];const $=id=>document.getElementById(id);const titles={Track:['진행 중인 작업','실행 상황을 확인하고, 필요한 결정을 이어가세요.'],Trail:['작업이 남긴 이력','변경과 산출물, 인계의 근거를 시간순으로 확인합니다.'],Trace:['실행 과정과 원인','선택한 실행의 단계와 오류, 수집 범위를 확인합니다.'],Map:['작업과 실행의 관계','목표부터 작업·세션·산출물까지 연결해 봅니다.']};
function render(){let state=$('state').value;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));$('title').textContent=titles[tab][0];$('description').textContent=titles[tab][1];$('connection').textContent=state==='offline'?'○ 장치 연결 끊김':'● 예시 장치 연결됨';$('notice').className='notice';$('notice').textContent=state==='offline'?'마지막 관측 3분 전 · 실행 상태는 최신이 아닐 수 있습니다. 명령을 보낼 수 없습니다.':'';let rows=tasks.filter(t=>t.title.includes($('search').value)||t.app.toLowerCase().includes($('search').value.toLowerCase()));if(state==='empty')rows=[];
if(state==='error'){$('view').innerHTML='<h2>작업을 가져오지 못했습니다.</h2><button id="retry">다시 시도</button>';$('retry').onclick=()=>{$('state').value='live';render()}}else if(!rows.length){$('view').innerHTML='<h2>표시할 작업이 없습니다.</h2><p>검색어와 연결한 앱을 확인해 주세요.</p>'}else if(tab==='Track'){$('view').innerHTML='<div class="table-wrap"><table><thead><tr><th>작업</th><th>실행 앱</th><th>상태</th><th>최종 수신</th></tr></thead><tbody>'+rows.map(t=>`<tr class="${selected.id===t.id?'selected':''}"><td><button data-id="${t.id}">${t.title}</button><br><small>${t.id}</small></td><td>${t.app}</td><td><span class="badge ${t.cls}">${t.status}</span></td><td>${t.time}</td></tr>`).join('')+'</tbody></table></div>'}else if(tab==='Trail'){$('view').innerHTML='<h2>'+selected.title+'</h2><ol class="timeline"><li><time>10:42 · Demian / run-17</time>도구 실행 완료 · 이벤트 schema 검사 통과<br><small>증거: fixture-result.json · 예시</small></li><li><time>10:39 · Desktop</time>adapter.ts 수정 관측<br><small>관측 기록이며 작업 완료 판정과 별개</small></li><li><time>10:35 · Assistant</time>업무 지시와 Task 연결</li></ol>'}else if(tab==='Trace'){$('view').innerHTML='<h2>'+selected.title+' / run-17</h2><table><tr><th>단계</th><th>결과</th><th>시간</th></tr><tr><td>1. 작업 맥락 읽기</td><td>성공</td><td>180ms</td></tr><tr><td>2. schema 검사</td><td>성공</td><td>420ms</td></tr><tr><td>3. 연결 검증</td><td>수집 중</td><td>unknown</td></tr></table><pre>source: demian / fixture-device\nparent_run: run-12\nevidence: schema-check / revision example\n비용: unknown (제공되지 않음)</pre>'}else{$('view').innerHTML='<div class="graph"><div class="node">목표<br>실행 관측 통합</div><span>→</span><button class="node" data-id="'+selected.id+'">'+selected.title+'</button><span>→</span><div class="node">run-17<br>Demian Session</div></div><h2>관계 목록</h2><table><tr><th>출발</th><th>관계</th><th>도착</th></tr><tr><td>목표</td><td>포함</td><td>'+selected.id+'</td></tr><tr><td>'+selected.id+'</td><td>실행</td><td>run-17</td></tr><tr><td>run-17</td><td>산출물</td><td>fixture-result.json</td></tr></table>'}
$('detail').innerHTML='<div class="eyebrow">Selected Task</div><h2>'+selected.title+'</h2><span class="badge '+selected.cls+'">'+selected.status+'</span><p>'+selected.id+' · '+selected.app+'<br>최종 수신 '+selected.time+'<br>검증: 未수용 · 원문 근거 연결 예정</p><h2>다음 행동</h2><p>'+(selected.status==='승인 대기'?'게시 대상과 문서 revision을 확인한 뒤 원래 앱에서 승인합니다.':'선택한 작업의 실행 근거를 확인하세요.')+'</p><button id="action" '+(state==='offline'?'disabled':'')+'>'+(selected.status==='승인 대기'?'승인 요청 확인':'원래 앱 열기')+'</button><p>시안 버튼은 외부 앱을 실행하지 않습니다.</p>';$('action').onclick=()=>{$('feedback').textContent='예시: '+selected.app+'의 '+selected.id+' 상세로 이동합니다. 실제 명령은 전송하지 않았습니다.'};document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=tasks.find(t=>t.id===b.dataset.id);render()});}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$('feedback').textContent='';render()});$('search').oninput=render;$('state').onchange=render;render();
</script></div></html>
